<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Varlinkbio — Link in Bio</title>
<meta name="description" content="Satu link untuk semua"/>
<meta property="og:title" content="Varlinkbio"/>
<meta property="og:description" content="Satu link untuk semua"/>
<meta property="og:type" content="website"/>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><circle cx='50' cy='50' r='22' fill='%23ffd700' stroke='%23fff' stroke-width='4'/></svg>"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet"/>

<style>
/* ═══════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f0ebe0;--ink:#0a0a0a;--yellow:#ffd700;
  --red:#ff2a2a;--green:#22c55e;--blue:#2563eb;
  --pink:#ff69b4;--purple:#a78bfa;--white:#fff;
  --orange:#ff8c00;--gold:#d4af37;
}
html,body{
  min-height:100vh;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  color:var(--ink);
  overflow-x:hidden;
}
body{position:relative}
a{text-decoration:none;color:inherit}
img,video{display:block;max-width:100%}
button{font-family:inherit}

/* ═══════════════════════════════════════════════════════════
   LOADING SCREEN
   ═══════════════════════════════════════════════════════════ */
.vb-loading{
  position:fixed;inset:0;z-index:9999;
  background:#f0ebe0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px;
  font-weight:800;text-transform:uppercase;
  font-size:13px;letter-spacing:1px;
  transition:opacity .3s;
}
.vb-loading.hide{opacity:0;pointer-events:none}
.vb-loading .spinner{
  width:48px;height:48px;
  border:4px solid #0a0a0a;
  border-top-color:transparent;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════════════════════════════════════════════════════════
   ERROR PAGE
   ═══════════════════════════════════════════════════════════ */
.vb-error{
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 18px;text-align:center;
  background:#f0ebe0;
  background-image:radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px),
    radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px);
  background-size:20px 20px,20px 20px;
  background-position:0 0,10px 10px;
}
.vb-error .icon{font-size:80px;margin-bottom:16px}
.vb-error h1{
  font-size:24px;font-weight:900;
  text-transform:uppercase;margin-bottom:8px;
}
.vb-error p{
  font-size:13.5px;font-weight:600;color:#555;
  margin-bottom:20px;max-width:320px;line-height:1.6;
}
.vb-error a{
  display:inline-block;padding:12px 20px;
  background:#0a0a0a;color:#fff;
  border:2.5px solid #0a0a0a;border-radius:10px;
  font-weight:900;font-size:13px;
  text-transform:uppercase;letter-spacing:.5px;
  box-shadow:3px 3px 0 #ffd700;
}

/* ═══════════════════════════════════════════════════════════
   BIO WRAPPER
   ═══════════════════════════════════════════════════════════ */
.bio-wrap{
  min-height:100vh;width:100%;
  position:relative;overflow-x:hidden;
  color:var(--ink);
  padding:34px 18px 60px;
  display:flex;flex-direction:column;align-items:center;
  font-weight:700;z-index:2;
}
.bio-inner{width:100%;max-width:420px;position:relative;z-index:2}

/* Decoration floating */
.bio-deco{position:fixed;pointer-events:none;z-index:1}
.bio-deco.d1{
  width:60px;height:60px;top:8%;left:6%;
  background:var(--red);border:3px solid var(--ink);
  transform:rotate(-12deg);box-shadow:5px 5px 0 var(--ink);
  animation:deco1 6s ease-in-out infinite;
}
.bio-deco.d2{
  width:38px;height:38px;top:16%;right:8%;
  background:var(--blue);border:3px solid var(--ink);
  border-radius:50%;transform:rotate(20deg);
  box-shadow:4px 4px 0 var(--ink);
  animation:deco2 7s ease-in-out infinite;
}
.bio-deco.d3{
  width:44px;height:44px;bottom:20%;right:6%;
  background:var(--yellow);border:3px solid var(--ink);
  transform:rotate(15deg);box-shadow:4px 4px 0 var(--ink);
  animation:deco3 8s ease-in-out infinite;
}
@keyframes deco1{
  0%,100%{transform:rotate(-12deg) translate(0,0)}
  50%{transform:rotate(-12deg) translate(6px,-8px)}
}
@keyframes deco2{
  0%,100%{transform:rotate(20deg) translate(0,0)}
  50%{transform:rotate(20deg) translate(-6px,8px)}
}
@keyframes deco3{
  0%,100%{transform:rotate(15deg) translate(0,0)}
  50%{transform:rotate(15deg) translate(4px,-6px)}
}

/* ═══════════════════════════════════════════════════════════
   BANNER
   ═══════════════════════════════════════════════════════════ */
.bio-banner{
  width:100%;max-width:100%;
  margin:0 auto 16px;height:110px;
  border:3px solid var(--ink);border-radius:12px;
  overflow:hidden;box-shadow:6px 6px 0 var(--ink);
  background:var(--white);position:relative;
}
.bio-banner img,
.bio-banner video{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:480px){
  .bio-banner{height:95px;margin-bottom:14px}
}

/* ═══════════════════════════════════════════════════════════
   AVATAR
   ═══════════════════════════════════════════════════════════ */
.bio-avatar{
  width:110px;height:110px;border-radius:50%;
  border:4px solid var(--ink);overflow:hidden;
  background:var(--white);margin:0 auto;
  box-shadow:6px 6px 0 var(--ink);
}
.bio-avatar img{width:100%;height:100%;object-fit:cover}
.bio-avatar.placeholder{
  display:grid;place-items:center;
  font-size:42px;font-weight:900;
  background:var(--yellow);
}

/* ═══════════════════════════════════════════════════════════
   HEADER
   ═══════════════════════════════════════════════════════════ */
.bio-header{
  display:flex;flex-direction:column;align-items:center;
  margin-bottom:14px;position:relative;
}
.bio-title-top{
  display:inline-block;padding:5px 14px;
  background:var(--white);color:var(--ink);
  font-size:13px;font-weight:900;
  text-transform:uppercase;letter-spacing:1.5px;
  border:3px solid var(--ink);
  transform:rotate(-4deg);margin-top:12px;
  box-shadow:3px 3px 0 var(--ink);z-index:3;
}
.bio-name{
  display:inline-block;padding:7px 18px;
  background:var(--yellow);color:var(--ink);
  font-size:21px;font-weight:900;
  text-transform:uppercase;letter-spacing:.5px;
  border:3px solid var(--ink);
  transform:rotate(2deg);margin-top:-4px;
  box-shadow:5px 5px 0 var(--ink);
  text-align:center;max-width:100%;
  word-break:break-word;z-index:2;
}
.bio-bio{
  display:inline-block;padding:6px 14px;
  background:var(--red);color:var(--white);
  font-size:12px;font-weight:800;
  text-transform:uppercase;letter-spacing:.5px;
  border:3px solid var(--ink);
  transform:rotate(-2deg);margin-top:-2px;
  box-shadow:4px 4px 0 var(--ink);
  text-align:center;max-width:100%;
  word-break:break-word;z-index:1;
}
.bio-plan-badge{
  display:inline-block;padding:3px 12px;
  background:var(--ink);color:var(--yellow);
  font-size:10px;font-weight:900;
  text-transform:uppercase;letter-spacing:1.5px;
  border:2px solid var(--yellow);border-radius:999px;
  margin-top:10px;box-shadow:2px 2px 0 var(--ink);
}
.bio-plan-badge.starter{
  background:var(--green);color:#fff;border-color:var(--ink);
}
.bio-plan-badge.pro{
  background:var(--blue);color:#fff;border-color:var(--ink);
}
.bio-plan-badge.ultimate{
  background:var(--ink);color:var(--yellow);border-color:var(--yellow);
}

/* ═══════════════════════════════════════════════════════════
   LOGOS PARTNER
   ═══════════════════════════════════════════════════════════ */
.bio-logos{
  display:flex;justify-content:center;
  align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:14px;margin-top:4px;
}
.bio-logo-item{
  width:44px;height:44px;border-radius:50%;
  border:2.5px solid var(--ink);background:var(--white);
  overflow:hidden;display:grid;place-items:center;
  box-shadow:3px 3px 0 var(--ink);
}
.bio-logo-item img{
  width:100%;height:100%;object-fit:contain;padding:4px;
}
.bio-logo-item .fallback{
  font-weight:900;font-size:14px;color:var(--ink);
}

/* ═══════════════════════════════════════════════════════════
   LINKS
   ═══════════════════════════════════════════════════════════ */
.bio-links{display:flex;flex-direction:column;gap:14px}

.bio-link{
  display:flex;align-items:center;justify-content:center;
  gap:10px;padding:15px 18px;
  border:3px solid var(--ink);border-radius:12px;
  font-weight:900;font-size:14.5px;
  text-transform:uppercase;letter-spacing:.5px;
  position:relative;
  box-shadow:6px 6px 0 var(--ink);
  cursor:pointer;min-height:56px;
  background:var(--white);color:var(--ink);
  animation:linkFadeIn .4s ease both;
  transition:transform .1s, box-shadow .1s;
}
@keyframes linkFadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}
.bio-link:hover{
  transform:translate(-2px,-2px);
  box-shadow:8px 8px 0 var(--ink);
}
.bio-link:active{
  transform:translate(4px,4px);
  box-shadow:0 0 0 var(--ink);
}
.bio-link .licon{
  width:22px;height:22px;
  display:grid;place-items:center;flex-shrink:0;
}
.bio-link .licon svg{
  width:100%;height:100%;
  stroke:currentColor;fill:none;
  stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
}
.bio-link .ltext{flex:1;text-align:center}

/* ═══════════════════════════════════════════════════════════
   FEATURED LINK
   ═══════════════════════════════════════════════════════════ */
.bio-link.bio-featured{
  display:flex;flex-direction:column;
  align-items:stretch;padding:0;overflow:hidden;
  gap:0;background:var(--feat-bg,var(--white));
  color:var(--feat-fg,var(--ink));
  min-height:0;position:relative;
  border:3px solid var(--ink);border-radius:12px;
  box-shadow:6px 6px 0 var(--ink);
}
.bio-link.bio-featured:hover{
  transform:translate(-2px,-2px);
  box-shadow:8px 8px 0 var(--ink);
}
.bio-link.bio-featured .feat-img-wrap{
  padding:var(--feat-padding,10px);
  display:flex;justify-content:center;
  align-items:center;width:100%;
  background:var(--feat-bg,var(--white));
}
.bio-link.bio-featured .feat-img{
  width:80%;height:auto;
  aspect-ratio:var(--feat-ratio,16/9);
  object-fit:cover;
  object-position:var(--feat-pos-x,50%) var(--feat-pos-y,50%);
  transform:scale(var(--feat-zoom,1));
  transform-origin:var(--feat-pos-x,50%) var(--feat-pos-y,50%);
  border:2.5px solid var(--ink);border-radius:8px;
  display:block;background:var(--white);
}
.bio-link.bio-featured .feat-body{
  padding:10px 14px 12px;text-align:center;
  background:var(--feat-bg,var(--white));
  color:var(--feat-fg,var(--ink));
}
.bio-link.bio-featured .feat-body b{
  font-size:14.5px;font-weight:900;
  text-transform:uppercase;letter-spacing:.5px;
}

/* ═══════════════════════════════════════════════════════════
   EMBED
   ═══════════════════════════════════════════════════════════ */
.bio-embed{
  border:3px solid var(--ink);border-radius:12px;
  overflow:hidden;box-shadow:6px 6px 0 var(--ink);
  background:var(--white);
}
.bio-embed iframe{
  width:100%;display:block;border:none;aspect-ratio:16/9;
}

/* ═══════════════════════════════════════════════════════════
   FOOTER / WATERMARK
   ═══════════════════════════════════════════════════════════ */
.bio-footer{
  margin-top:28px;font-size:11px;
  color:var(--ink);font-weight:800;
  text-transform:uppercase;letter-spacing:1px;
  background:var(--white);border:2px solid var(--ink);
  padding:6px 12px;border-radius:20px;
  box-shadow:2px 2px 0 var(--ink);
  display:inline-block;align-self:center;
}
.bio-footer a{
  color:var(--ink);font-weight:900;
  text-decoration:underline;
}

/* ═══════════════════════════════════════════════════════════
   CTA FLOAT
   ═══════════════════════════════════════════════════════════ */
.bio-cta-float{
  position:fixed;bottom:16px;right:16px;z-index:9990;
  display:inline-flex;align-items:center;gap:6px;
  background:var(--ink);color:var(--yellow);
  font-weight:900;font-size:11px;
  text-transform:uppercase;letter-spacing:.5px;
  padding:8px 14px;border-radius:999px;
  border:2.5px solid var(--yellow);
  box-shadow:3px 3px 0 var(--yellow);
  animation:ctaBounce 2.5s ease-in-out infinite;
}
@keyframes ctaBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-3px)}
}

/* ═══════════════════════════════════════════════════════════
   17 TEMA WARNA
   ═══════════════════════════════════════════════════════════ */
.theme-neo-cream{
  background-color:#f0ebe0;color:var(--ink);
  background-image:
    radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px),
    radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px);
  background-size:20px 20px,20px 20px;
  background-position:0 0,10px 10px;
  animation:dotsFlow 24s linear infinite;
}
@keyframes dotsFlow{
  from{background-position:0 0,10px 10px}
  to{background-position:400px -400px,410px -390px}
}
.theme-neo-midnight{
  background-color:#1e293b;color:#e2e8f0;
  background-image:
    radial-gradient(circle,#94a3b8 1.4px,transparent 1.4px),
    radial-gradient(circle,#94a3b8 1.4px,transparent 1.4px);
  background-size:20px 20px,20px 20px;
  background-position:0 0,10px 10px;
}
.theme-neo-midnight .bio-link{
  background:#0f172a;color:#e2e8f0;border-color:#e2e8f0;
}
.theme-neo-dark{
  background-color:#0a0a0a;color:#fff;

  background-size:20px 20px,20px 20px;
  background-position:0 0,10px 10px;
}
.theme-neo-dark .bio-link{background:#1a1a1a;color:#fff}
.theme-neo-blue{
  background-color:#2563eb;color:#fff;

    radial-gradient(circle,#fff 1.4px,transparent 1.4px),

  background-size:20px 20px,20px 20px;

}

    radial-gradient(circle,#fff 1.4px,transparent 1.4px),

  background-size:20px 20px,20px 20px;

}
.theme-neo-rose .bio-link{background:#fff;color:#f43f5e}
.theme-neo-pink{
  background-color:#ff69b4;color:var(--ink);
  background-image:
    radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px),

  background-size:20px 20px,20px 20px;

}
.theme-neo-green{
  background-color:#22c55e;color:var(--ink);
  background-image:
    radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px),
    radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px);
  background-size:20px 20px,20px 20px;
  background-position:0 0,10px 10px;
}
.theme-neo-purple{
  background-color:#a78bfa;color:var(--ink);
  background-image:
    radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px),
    radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px);
  background-size:20px 20px,20px 20px;

}
.theme-neo-orange{
  background-color:#ff8c00;color:var(--ink);
  background-image:
    radial-gradient(circle,#0a0a0a 1.4px,transparent 1.4px),

  background-size:20px 20px,20px 20px;
  background-position:0 0,10px 10px;
}
.theme-neo-ocean{
  background-color:#0ea5e9;color:var(--ink);
  background-image:
    radial-gradient(circle,#fff 1.4px,transparent 1.4px),
    radial-gradient(circle,#fff 1.4px,transparent 1.4px);
  background-size:20px 20px,20px 20px;
  background-position:0 0,10px 10px;
}
.theme-neo-coffee{
  background-color:#78350f;color:#fef3c7;
  background-image:
    radial-gradient(circle,#fef3c7 1.4px,transparent 1.4px),

  background-size:20px 20px,20px 20px;

}
.theme-neo-coffee .bio-link{background:#fef3c7;color:#78350f}
.theme-neo-sunset{
  color:var(--ink);
  background:linear-gradient(135deg,#ff8c00 0%,#ff6b35 35%,#ff69b4 70%,#a78bfa 100%);
  background-size:200% 200%;
  animation:sunsetShift 15s ease-in-out infinite;
}
@keyframes sunsetShift{
  0%,100%{background-position:0% 50%}

}
.theme-neo-galaxy{
  color:#fff;

}
.theme-neo-galaxy .bio-link{

}

}

}
.theme-neo-neon .bio-name{

}
.theme-neo-neon .bio-bio{background:#00ffcc;color:#0a0a14}
.theme-neo-retro{
  background-color:#ff00ff;color:#00ffff;

}
.theme-neo-retro .bio-link{background:#fff;color:#ff00ff;border-color:#000}

}

.theme-neo-gold{
  background-color:#0a0a0a;color:#d4af37;
  background-image:
    linear-gradient(90deg,rgba(212,175,55,.05) 1px,transparent 1px),

}
.theme-neo-gold .bio-link{

}

/* ═══════════════════════════════════════════════════════════
   ANIMASI
   ═══════════════════════════════════════════════════════════ */
.anim-bounce .bio-link{animation:animBounce 2s ease-in-out infinite}
@keyframes animBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.anim-shake .bio-link:hover{

function esc(s){

function contrastText(hex){
  try{
    if(!hex) return "#0a0a0a";
    var c = String(hex).trim();
    if(c.startsWith("linear-gradient")) return "#ffffff";
    if(!c.startsWith("#")) c = "#" + c;
    if(c.length === 4) c = "#" + c[1]+c[1]+c[2]+c[2]+c[3]+c[3];
    if(c.length !== 7) return "#0a0a0a";
    var r = parseInt(c.slice(1,3),16);
    var g = parseInt(c.slice(3,5),16);
    var b = parseInt(c.slice(5,7),16);
    var lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.6 ? "#0a0a0a" : "#ffffff";
  }catch(e){ return "#0a0a0a"; }
}

};

function pascalCase(str){
  return String(str||"").split("-").map(function(s){
    return s.charAt(0).toUpperCase() + s.slice(1);
  }).join("");
}

function renderLucide(name){
  if(!window.lucide || !window.lucide.icons) return "";
  var p = pascalCase(name);
  var icon = window.lucide.icons[p];
  if(!icon) return "";
  var inner = "";
  for(var i=0;i<icon.length;i++){
    var item = icon[i];
    if(!item || !item[0]) continue;
    var tag = item[0];
    var attrs = item[1] || {};
    var attrStr = "";
    Object.keys(attrs).forEach(function(k){
      var v = String(attrs[k]).replace(/"/g,"&quot;");
      attrStr += " " + k + '="' + v + '"';
    });
    inner += "<" + tag + attrStr + "></" + tag + ">";
  }
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
}

var EMOJI_REGEX = /([\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{27BF}]|[\u{2190}-\u{21FF}]|[\u{2B00}-\u{2BFF}]|[\u{FE0F}]|[\u{200D}])/gu;

function emojiToSvg(text){
  if(!text) return text;
  if(!window.lucide || !window.lucide.icons) return text;
  return String(text).replace(EMOJI_REGEX, function(match){
    if(match === "\uFE0F" || match === "\u200D") return "";
    var name = EMOJI_MAP[match];
    if(!name) return match;
    var svg = renderLucide(name);
    if(!svg) return match;
    return '<span class="lucide-emoji">' + svg + '</span>';
  });
}

function initEmojiObserver(){
  var SKIP = ["SCRIPT","STYLE","TEXTAREA","INPUT","CODE","PRE","SVG","PATH","CIRCLE","RECT","POLYGON","LINE","POLYLINE","ELLIPSE","G","DEFS","IFRAME"];
  
  function convertNode(node){
    if(!node || !node.nodeValue) return;
    var txt = node.nodeValue;
    if(!txt) return;
    EMOJI_REGEX.lastIndex = 0;
    if(!EMOJI_REGEX.test(txt)) return;
    try{
      var html = emojiToSvg(txt);
      if(html && html !== txt){
        var span = document.createElement("span");
        span.style.display = "contents";
        span.setAttribute("data-emoji-converted","1");
        span.innerHTML = html;
        node.parentNode.replaceChild(span, node);
      }
    }catch(e){}
  }
  
  function walk(root){
    if(!root || root.nodeType !== 1) return;
    if(SKIP.indexOf(root.tagName) !== -1) return;
    if(root.classList && root.classList.contains("lucide-emoji")) return;
    var kids = Array.prototype.slice.call(root.childNodes || []);
    kids.forEach(function(k){
      if(k.nodeType === 3) convertNode(k);
      else if(k.nodeType === 1) walk(k);
    });
  }
  
  // Initial scan
  setTimeout(function(){ walk(document.body); }, 800);
  setTimeout(function(){ walk(document.body); }, 2000);
  
  // Observer
  try{
    var obs = new MutationObserver(function(muts){
      muts.forEach(function(m){
        if(m.target && m.target.closest && m.target.closest(".lucide-emoji")) return;
        if(m.target && m.target.closest && m.target.closest("iframe")) return;
        m.addedNodes.forEach(function(n){
          if(n.nodeType === 1 && n.tagName !== "IFRAME") walk(n);
          else if(n.nodeType === 3) convertNode(n);
        });
      });
    });
    obs.observe(document.body, { childList: true, subtree: true });
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   MUSIC AUTO-PLAY (Opsi A)
   ═══════════════════════════════════════════════════════════ */
var MusicPlayer = {
  _audio: null,
  _current: null,
  _started: false,
  _wasPlaying: false,
  
  init: async function(musicId){
    if(!musicId) return;
    try{
      var doc = await FB.db.collection("music_library").doc(musicId).get();
      if(!doc.exists) return;
      var data = doc.data();
      if(!data || !data.url) return;
      
      this._current = data;
      this._audio = new Audio();
      this._audio.src = data.url;
      this._audio.loop = true;
      this._audio.volume = 0.6;
      this._audio.preload = "auto";
      
      // Try autoplay
      var self = this;
      var promise = this._audio.play();
      if(promise && promise.then){
        promise.then(function(){
          self._started = true;
          console.log("🎵 Music autoplay OK:", data.title);
        }).catch(function(err){
          console.log("🎵 Autoplay di-block, nunggu tap:", err.message);
          self._setupTapFallback();
        });
      }
      
      // Page visibility (auto-pause saat hidden)
      document.addEventListener("visibilitychange", function(){
        if(document.hidden){
          if(self._audio && !self._audio.paused){
            self._wasPlaying = true;
            self._audio.pause();
          }
        } else {
          if(self._wasPlaying && self._audio && self._audio.paused){
            self._audio.play().catch(function(){});
            self._wasPlaying = false;
          }
        }
      });
      
      // Before unload
      window.addEventListener("beforeunload", function(){
        if(self._audio){ self._audio.pause(); self._audio.currentTime = 0; }
      });
      
    }catch(e){
      console.warn("Music init error:", e);
    }
  },
  
  _setupTapFallback: function(){
    var self = this;
    function handleTap(){
      if(self._audio && self._audio.paused){
        self._audio.play().then(function(){
          self._started = true;
          console.log("🎵 Music started (tap)");
        }).catch(function(){});
      }
      document.removeEventListener("click", handleTap);
      document.removeEventListener("touchstart", handleTap);
    }
    document.addEventListener("click", handleTap, { once: true });
    document.addEventListener("touchstart", handleTap, { once: true });
  }
};

function renderLink(link, idx){
  var url = link.url || "#";
  var label = link.label || "Link";

  var iconName = getLinkIcon(url);
  
  // Featured link
  if(link.type === "featured" && link.thumb){
    var bg = bgColor || "#ffffff";
    var fg = contrastText(bg);
    var ratio = link.featRatio === "1:1" ? "1/1" :
                link.featRatio === "4:3" ? "4/3" :
                link.featRatio === "auto" ? "auto" : "16/9";
    var posX = link.featPosX != null ? link.featPosX : 50;
    var posY = link.featPosY != null ? link.featPosY : 50;
    var zoom = link.featZoom != null ? link.featZoom : 1;
    var pad = link.featPadding != null ? link.featPadding : 10;
    
    return '<a class="bio-link bio-featured" href="' + esc(url) + '" target="_blank" rel="noopener" data-idx="' + idx + '" ' +
      'style="animation-delay:' + delay + 's;--feat-bg:' + bg + ';--feat-fg:' + fg + ';' +
      '--feat-ratio:' + ratio + ';--feat-pos-x:' + posX + '%;--feat-pos-y:' + posY + '%;' +
      '--feat-zoom:' + zoom + ';--feat-padding:' + pad + 'px">' +
      '<div class="feat-img-wrap"><img class="feat-img" src="' + esc(link.thumb) + '" alt="' + esc(label) + '"/></div>' +
      '<div class="feat-body"><b>' + esc(label) + '</b></div>' +
    '</a>';
  }
  
  // Embed
  if(["youtube","spotify","vimeo","tiktok"].indexOf(link.type) !== -1){
    var embedUrl = getEmbedUrl(url);
    if(embedUrl){
      return '<div class="bio-embed" style="animation-delay:' + delay + 's">' +
        '<iframe src="' + esc(embedUrl) + '" allowfullscreen loading="lazy" ' +
        'allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture"></iframe>' +
      '</div>';
    }
  }
  
  // Classic
  var customStyle = bgColor ? 'background:' + bgColor + ';color:' + contrastText(bgColor) : "";
  return '<a class="bio-link" href="' + esc(url) + '" target="_blank" rel="noopener" ' +
    'data-idx="' + idx + '" style="animation-delay:' + delay + 's;' + customStyle + '">' +
    '<span class="licon">' + iconSvg(iconName) + '</span>' +
    '<span class="ltext">' + esc(label) + '</span>' +
  '</a>';
}

function renderBio(bio){
  var theme = bio.theme || "neo-cream";
  var themeClass = "theme-" + theme;
  var anim = bio.animation || "none";
  
  var links = Array.isArray(bio.links) ? bio.links.filter(function(l){ return l.active !== false; }) : [];
  var logos = Array.isArray(bio.logos) ? bio.logos : [];
  var showWatermark = bio.showWatermark !== false;
  
  // Custom theme (v7.6)
  var customThemeCSS = "";
  if(bio.customThemeData){
    customThemeCSS = buildCustomThemeCSS(bio.customThemeData);
    themeClass = "custom-theme-active";
  }
  
  var html = '<div class="bio-deco d1"></div>' +
    '<div class="bio-deco d2"></div>' +
    '<div class="bio-deco d3"></div>';
  
  html += '<div class="bio-wrap ' + themeClass + ' anim-' + anim + '">';
  html += '<div class="bio-inner">';
  
  html += renderBanner(bio);
  
  html += '<div class="bio-header">';
  html += renderAvatar(bio);
  html += '<div class="bio-title-top">LINK IN BIO</div>';
  if(bio.name) html += '<div class="bio-name">' + esc(bio.name) + '</div>';
  if(bio.bio) html += '<div class="bio-bio">' + esc(bio.bio) + '</div>';
  html += renderBadge(bio);
  html += '</div>';
  
  html += renderLogos(logos);
  
  html += '<div class="bio-links">';
  if(links.length){
    html += links.map(function(l, i){ return renderLink(l, i); }).join("");
  } else {
    html += '<div style="text-align:center;padding:20px;font-size:12.5px;font-weight:700;opacity:.7">Belum ada link.</div>';
  }
  html += '</div>';
  
  // Footer / Watermark
  if(showWatermark){
    html += '<div class="bio-footer" style="align-self:center;display:block;margin-left:auto;margin-right:auto">Dibuat dengan <a href="' + APP_URL + '/#/register" target="_blank">Varlinkbio</a></div>';
  } else {
    html += '<div class="bio-footer" style="align-self:center;display:block;margin-left:auto;margin-right:auto;opacity:.6">by Varoo</div>';
  }
  
  html += '</div></div>';
  
  // CTA float (kalo ada watermark)
  if(showWatermark){
    html += '<a class="bio-cta-float" href="' + APP_URL + '/#/register" target="_blank">⚡ Bikin Bio Kamu</a>';
  }
  
  // Lock overlay
  if(bio.lock){
    html += renderLock();
  }
  
  return {
    html: html,
    customThemeCSS: customThemeCSS
  };
}

function buildCustomThemeCSS(theme){
  if(!theme) return "";
  var c = theme.colors || {};
  var bg = c.bg || "#f0ebe0";
  var text = c.text || "#0a0a0a";
  var btnBg = c.btnBg || "#ffffff";
  var btnText = c.btnText || "#0a0a0a";
  var border = c.border || "#0a0a0a";
  var accent = c.accent || "#ffd700";
  var shadow = c.shadow || "#0a0a0a";
  
  var shadowStyle = "4px 4px 0 " + shadow;
  if(theme.shadowStyle === "none") shadowStyle = "none";
  else if(theme.shadowStyle === "soft") shadowStyle = "0 4px 12px rgba(0,0,0,.15)";
  else if(theme.shadowStyle === "glow") shadowStyle = "0 0 20px " + accent;
  
  var radius = (theme.borderRadius || 12) + "px";
  var font = "'" + (theme.font || "Inter") + "', sans-serif";
  
  var patternCSS = "";
  if(theme.bgPattern === "dots"){
    patternCSS = "background-image: radial-gradient(circle, " + text + " 1.4px, transparent 1.4px), radial-gradient(circle, " + text + " 1.4px, transparent 1.4px); background-size: 20px 20px, 20px 20px; background-position: 0 0, 10px 10px;";
  } else if(theme.bgPattern === "lines"){
    patternCSS = "background-image: repeating-linear-gradient(45deg, " + text + " 0, " + text + " 1px, transparent 1px, transparent 12px);";
  } else if(theme.bgPattern === "grid"){
    patternCSS = "background-image: linear-gradient(" + text + " 1px, transparent 1px), linear-gradient(90deg, " + text + " 1px, transparent 1px); background-size: 20px 20px;";
  } else if(theme.bgPattern === "gradient"){
    patternCSS = "background: " + (theme.bgGradient || "linear-gradient(135deg,#ffd700,#ff69b4)") + ";";
  }
  
  return '<style>' +
    '.custom-theme-active{' +
      'font-family: ' + font + ' !important;' +
      'background-color: ' + bg + ' !important;' +
      'color: ' + text + ' !important;' +
      patternCSS +
    '}' +
    '.custom-theme-active .bio-name{background:' + accent + ' !important;color:' + text + ' !important;border-color:' + border + ' !important;border-radius:' + radius + ' !important;box-shadow:' + shadowStyle + ' !important}' +
    '.custom-theme-active .bio-bio{background:' + accent + ' !important;color:' + text + ' !important;border-color:' + border + ' !important;border-radius:' + radius + ' !important}' +
    '.custom-theme-active .bio-title-top{background:' + btnBg + ' !important;color:' + btnText + ' !important;border-color:' + border + ' !important;border-radius:' + radius + ' !important}' +
    '.custom-theme-active .bio-link{background:' + btnBg + ' !important;color:' + btnText + ' !important;border-color:' + border + ' !important;border-radius:' + radius + ' !important;box-shadow:' + shadowStyle + ' !important;font-family:' + font + ' !important}' +
    '.custom-theme-active .bio-avatar{border-color:' + border + ' !important;box-shadow:' + shadowStyle + ' !important}' +
    '.custom-theme-active .bio-banner{border-color:' + border + ' !important;border-radius:' + radius + ' !important;box-shadow:' + shadowStyle + ' !important}' +
    '.custom-theme-active .bio-footer{background:' + btnBg + ' !important;color:' + btnText + ' !important;border-color:' + border + ' !important}' +
    '.custom-theme-active .bio-deco{display:none !important}' +
  '</style>';
}

function renderLock(){
  return '<div class="lock-overlay" id="lock-overlay">' +
    '<div class="lock-card">' +
    '<div class="li">🔒</div>' +
    '<h3>Bio Dikunci</h3>' +
    '<p>Masukkan password untuk melihat bio ini.</p>' +
    '<input type="password" id="lock-input" placeholder="Password" autofocus/>' +
    '<div class="lock-err" id="lock-err"></div>' +
    '<button id="lock-submit">Buka Bio</button>' +
    '</div></div>';
}

/* ═══════════════════════════════════════════════════════════
   SHOW ERROR PAGE
   ═══════════════════════════════════════════════════════════ */
function showError(msg){
  var app = document.getElementById("app");
  if(!app) return;
  app.innerHTML = '<div class="vb-error">' +
    '<div class="icon">🔍</div>' +
    '<h1>Bio Tidak Ditemukan</h1>' +
    '<p>' + esc(msg || "URL yang kamu buka gak ada atau udah dihapus.") + '</p>' +
    '<a href="' + APP_URL + '/#/register">Bikin Bio Kamu →</a>' +
  '</div>';
  var loading = document.getElementById("loading");
  if(loading) loading.classList.add("hide");
}

/* ═══════════════════════════════════════════════════════════
   ANALYTICS TRACKING
   ═══════════════════════════════════════════════════════════ */
function trackView(bioId){
  try{
    var today = new Date().toISOString().slice(0,10);
    var ref = FB.db.collection("bios").doc(bioId);
    ref.update({
      "stats.views": firebase.firestore.FieldValue.increment(1),
      ["stats.daily." + today + ".views"]: firebase.firestore.FieldValue.increment(1)
    }).catch(function(){});
  }catch(e){}
}

function trackClick(bioId, idx){
  try{
    var today = new Date().toISOString().slice(0,10);
    var ref = FB.db.collection("bios").doc(bioId);
    ref.update({
      ["stats.clicks." + idx]: firebase.firestore.FieldValue.increment(1),
      ["stats.daily." + today + ".clicks"]: firebase.firestore.FieldValue.increment(1)
    }).catch(function(){});
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   MAIN RENDER
   ═══════════════════════════════════════════════════════════ */
async function renderPage(slug){
  try{
    if(!slug){
      showError("Slug bio kosong");
      return;
    }
    
    // Fetch bio — coba by id, terus by slug
    var bio = null;
    try{
      var doc = await FB.db.collection("bios").doc(slug).get();
      if(doc.exists) bio = Object.assign({ id: doc.id }, doc.data());
    }catch(e){}
    
    if(!bio){
      try{
        var q = await FB.db.collection("bios").where("slug","==",slug).limit(1).get();
        if(!q.empty){
          var d = q.docs[0];
          bio = Object.assign({ id: d.id }, d.data());
        }
      }catch(e){}
    }
    
    if(!bio){
      showError("Bio dengan URL \"" + slug + "\" gak ditemukan.");
      return;
    }
    
    // Track view
    trackView(bio.id);
    
    // Title
    document.title = (bio.name || "Link in Bio") + " — Varlinkbio";
    var metaDesc = document.querySelector('meta[name="description"]');
    if(metaDesc && bio.bio) metaDesc.setAttribute("content", bio.bio);
    var ogTitle = document.querySelector('meta[property="og:title"]');
    if(ogTitle && bio.name) ogTitle.setAttribute("content", bio.name);
    var ogDesc = document.querySelector('meta[property="og:description"]');
    if(ogDesc && bio.bio) ogDesc.setAttribute("content", bio.bio);
    var ogImage = document.createElement("meta");
    ogImage.setAttribute("property","og:image");
    ogImage.setAttribute("content", bio.profile || bio.banner || "");
    document.head.appendChild(ogImage);
    
    // Render
    var result = renderBio(bio);
    var app = document.getElementById("app");
    if(!app){ return; }
    
    // Inject custom theme CSS
    if(result.customThemeCSS){
      var tempDiv = document.createElement("div");
      tempDiv.innerHTML = result.customThemeCSS;
      while(tempDiv.firstChild){
        document.head.appendChild(tempDiv.firstChild);
      }
    }
    
    app.innerHTML = result.html;
    
    // Init music
    if(bio.musicId){
      MusicPlayer.init(bio.musicId);
    }
    
    // Emoji converter
    initEmojiObserver();
    
    // Lock handle
    if(bio.lock){
      setupLock(bio);
    }
    
    // Track clicks
    $$(".bio-link[data-idx]").forEach(function(el){
      el.addEventListener("click", function(){
        var idx = el.getAttribute("data-idx");
        trackClick(bio.id, idx);
      });
    });
    
    // Hide loading
    var loading = document.getElementById("loading");
    if(loading) loading.classList.add("hide");
    
    console.log("✅ Bio rendered:", bio.name);
    
  }catch(e){
    console.error("Render error:", e);
    showError("Terjadi kesalahan: " + e.message);
  }
}

/* ═══════════════════════════════════════════════════════════
   LOCK SETUP
   ═══════════════════════════════════════════════════════════ */
function setupLock(bio){
  try{
    var overlay = document.getElementById("lock-overlay");
    var input = document.getElementById("lock-input");
    var btn = document.getElementById("lock-submit");
    var errEl = document.getElementById("lock-err");
    
    if(!overlay || !input || !btn) return;
    
    function tryUnlock(){
      var val = input.value.trim();
      if(val === bio.lock){
        overlay.remove();
        if(window.Sound) Sound.success();
      } else {
        errEl.textContent = "Password salah!";
        input.value = "";
        input.focus();
      }
    }
    
    btn.addEventListener("click", tryUnlock);
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter") tryUnlock();
    });
    setTimeout(function(){ input.focus(); }, 300);
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════
   ROUTER
   ═══════════════════════════════════════════════════════════ */
function resolveRoute(){
  var raw = location.hash.slice(1) || "/";
  var path = raw.split("?")[0];
  
  if(path.indexOf("/u/") === 0){
    var slug = path.slice(3);
    renderPage(slug);
  } else {
    // Redirect ke APP
    location.replace(APP_URL + "/#/");
  }
}

window.addEventListener("hashchange", resolveRoute);

/* ═══════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════ */
function boot(){
  console.log("%c╔════════════════════════════════════════╗","color:#ffd700;font-weight:bold");
  console.log("%c║  VLINK-BIO v10.0                       ║","color:#ffd700;font-weight:bold");
  console.log("%c║  by Varoo                              ║","color:#ffd700;font-weight:bold");
  console.log("%c╚════════════════════════════════════════╝","color:#ffd700;font-weight:bold");
  
  if(!FB.ready){
    setTimeout(boot, 500);
    return;
  }
  
  resolveRoute();
}

if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", function(){ setTimeout(boot, 200); });
} else {
  setTimeout(boot, 200);
}

})();
